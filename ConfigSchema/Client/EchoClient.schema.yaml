EchoClient:
  ServerIp: { type: string, default: 127.0.0.1, required: true }
  Port: { type: uint16, default: 19000, required: true }
  LoginUserIdBase: { type: uint32, default: 1000 }
  SessionCount: { type: int32, default: 1 }
  RequestCount: { type: int32, default: 1 }
  PayloadSize: { type: int32, default: 16 }
  SendChunkSize: { type: int32, default: 0 }
  SendChunkDelayMs: { type: int32, default: 0 }
  RecvBufferSize: { type: int32, default: 32 }
  ResponseThreadCount: { type: int32, default: 1 }
  ResponsesPerThread: { type: int32, default: 1 }
  HoldSeconds: { type: int32, default: 0 }
  IntervalMs: { type: int32, default: 1000 }
  PacketsPerSend: { type: int32, default: 1 }
  ReconnectProbabilityPercent: { type: int32, default: 0 }
  ReconnectDelayMs: { type: int32, default: 100 }
  ConnectsPerSecond: { type: int32, default: 0 }
  WorkerThreadCount: { type: int32, default: 4 }
  RoomChangeProbabilityPercent: { type: int32, default: 25 }
  MaxRoomEnterRetryCount: { type: int32, default: 5 }
  MaxRoomChangeRetryCount: { type: int32, default: 3 }
  EnablePagePool: { type: bool, default: true }
  PageSize: { type: int32, default: 4096 }

Debug:
  Quiet: { type: bool, default: false }
  BootstrapTrace: { type: bool, default: false }
  TraceSessionIndex: { type: int32, default: 0 }
  RecvTimeoutMs: { type: int32, default: 0 }
  RoomListRecvTimeoutMs: { type: int32, default: -1 }
  EchoRecvTimeoutMs: { type: int32, default: -1 }
  RttCsvPath: { type: string, default: "" }
  RttFlushIntervalSeconds: { type: int32, default: 60 }
