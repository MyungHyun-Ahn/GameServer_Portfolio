services:
  account-mysql:
    image: mysql:8.0
    container_name: gameserverportfolio-account-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the repository root .env file}
      MYSQL_DATABASE: accountdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the repository root .env file}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - account_mysql_data:/var/lib/mysql
      - ../LoginServer/db/schema.sql:/docker-entrypoint-initdb.d/001-account-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - login-platform-net

  chat-redis:
    image: redis:7.2-alpine
    container_name: gameserverportfolio-chat-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
      - --save
      - "60"
      - "1"
    ports:
      - "6379:6379"
    volumes:
      - chat_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - login-platform-net

  login-server:
    build:
      context: ../LoginServer
      dockerfile: Dockerfile
    container_name: gameserverportfolio-login-server
    restart: unless-stopped
    environment:
      LOGIN_SERVER_HOST: 0.0.0.0
      LOGIN_SERVER_PORT: 18080
      MYSQL_HOST: account-mysql
      MYSQL_PORT: 3306
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the repository root .env file}
      MYSQL_DATABASE: accountdb
      MYSQL_CONNECTION_LIMIT: 10
      REDIS_HOST: chat-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0
      REDIS_CONNECT_TIMEOUT_MS: 3000
      CHAT_SERVER_IP: 127.0.0.1
      CHAT_SERVER_PORT: 19100
      CHAT_TICKET_KEY_PREFIX: "chat:ticket:"
      AUCTION_TICKET_KEY_PREFIX: "auction:ticket:"
      WORLD_TICKET_KEY_PREFIX: "world:ticket:"
      CHAT_TICKET_TTL_SECONDS: 60
      AUCTION_SERVER_IP: 127.0.0.1
      AUCTION_SERVER_PORT: 19102
      WORLD_SERVER_IP: 127.0.0.1
      WORLD_SERVER_PORT: 19200
      WORLD_SERVER_INSTANCE_ID: 1
      ARGON2_MEMORY_COST_KIB: 19456
      ARGON2_TIME_COST: 2
      ARGON2_PARALLELISM: 1
      ARGON2_HASH_LENGTH: 32
    ports:
      - "18080:18080"
    depends_on:
      account-mysql:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18080/healthz').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - login-platform-net

networks:
  login-platform-net:
    driver: bridge

volumes:
  account_mysql_data:
  chat_redis_data:
